<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>구매 체크리스트</title>
<style>
  :root {
    --ground: #F5F7F4;
    --surface: #FFFFFF;
    --surface-2: #ECF0EA;
    --line: #DCE2D9;
    --line-soft: #E8EDE5;
    --ink: #161C19;
    --ink-2: #48534D;
    --ink-3: #7B867E;
    --accent: #1F5F52;
    --accent-ink: #16443A;
    --accent-soft: #DBEBE4;
    --warn: #8A5A11;
    --shadow: 0 1px 2px rgba(22,28,25,.05), 0 8px 24px -16px rgba(22,28,25,.28);
    --font-sans: 'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,
                 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    --font-mono: ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#111614; --surface:#191F1C; --surface-2:#212824; --line:#2C3531; --line-soft:#232B27;
      --ink:#E8EDE8; --ink-2:#A5B0AA; --ink-3:#75817A;
      --accent:#6FC3AC; --accent-ink:#9BD9C7; --accent-soft:#1C382F; --warn:#D6A251;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    }
  }

  :root[data-theme="dark"] {
    --ground:#111614; --surface:#191F1C; --surface-2:#212824; --line:#2C3531; --line-soft:#232B27;
    --ink:#E8EDE8; --ink-2:#A5B0AA; --ink-3:#75817A;
    --accent:#6FC3AC; --accent-ink:#9BD9C7; --accent-soft:#1C382F; --warn:#D6A251;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    padding: 0 16px 80px;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  .wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header { padding-top: 36px; display: flex; flex-direction: column; gap: 8px; }

  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; }

  .sub { color: var(--ink-3); font-size: 14px; margin: 0; }

  /* 진행 바 */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  }

  .prog { display: flex; align-items: baseline; gap: 7px; margin-right: auto; }
  .prog .n { font-family: var(--font-mono); font-size: 24px; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .prog .d { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .track { flex: 1 1 100%; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }

  .sync { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .sync::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--ink-3); margin-right:5px; vertical-align:1px; }
  .sync.ok { color: var(--accent); } .sync.ok::before { background: var(--accent); }
  .sync.busy { color: var(--warn); } .sync.busy::before { background: var(--warn); }

  a.back {
    font-family: var(--font-sans); font-size: 13px; text-decoration: none;
    color: var(--ink-2); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; white-space: nowrap;
  }
  a.back:hover { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

  .tog {
    font-family: var(--font-sans); font-size: 13px; cursor: pointer;
    color: var(--ink-2); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; white-space: nowrap;
  }
  .tog:hover { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

  /* 목록 */
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  .ghead {
    padding: 13px 16px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; gap: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  }

  .ghead .cnt { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }

  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    border-top: 1px solid var(--line-soft);
    cursor: pointer;
  }

  .group .item:first-of-type { border-top: 0; }
  .item:hover { background: var(--surface-2); }

  .item input {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; flex: none; margin: 0;
    border: 1.5px solid var(--ink-3); border-radius: 6px;
    background: var(--surface); cursor: pointer; position: relative;
  }

  .item input:checked { background: var(--accent); border-color: var(--accent); }

  .item input:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px;
    width: 4px; height: 10px;
    border: solid var(--surface); border-width: 0 2px 2px 0;
    transform: rotate(43deg);
  }

  .item input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .nm { font-size: 15.5px; font-weight: 500; letter-spacing: -.01em; }
  .item input:checked ~ .nm { color: var(--ink-3); text-decoration: line-through; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-3); font-size: 14.5px; line-height: 1.7; }

  body.hidedone .item.done { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="wrap">

  <header>

    <div class="track"><div class="fill" id="fill"></div></div>

      t: "10. 주방 수납 · 소모품",
      n: "다이소에서 구입 예정",
      items: [
        { name: "밀폐용기 (소) 세트", spec: "양념·소량 보관", cost: 0, p: M },
        { name: "밀폐용기 (중·대) 세트", spec: "반찬·냉동 보관", cost: 0, p: M },
        { name: "수저통", spec: "", cost: 0, p: M },
        { name: "식기 건조대", spec: "", cost: 0, p: M },
        { name: "행주 · 수세미", spec: "", cost: 0, p: M },
        { name: "주방세제 · 고무장갑", spec: "", cost: 0, p: M },
        { name: "랩 · 호일 · 위생백", spec: "", cost: 0, p: M },
        { name: "조미료통 · 소스병", spec: "", cost: 0, p: R }
      ]
    },
    {
      t: "11. 작은방 2개",
      n: "현관 쪽 방에 기존 장 있음 → 서재로 활용",
      items: [
        { name: "책상", spec: "기존 장이 있는 방에 배치. 창을 등지지 않게 측면 배치", cost: 0, p: R },
        { name: "사무용 의자", spec: "재택근무 있으면 여기에 예산 배분", cost: 0, p: R },
        { name: "책장", spec: "기존 장에 책 수납 가능하면 불필요", cost: 0, p: O }
      ]
    },
    {
      t: "12. 시공",
      n: "도배 확정. 업체 견적 3곳 이상 비교 후 금액 기입",
      items: [
        { name: "도배 (전체)", spec: "확정 항목. 잔금 직후 최우선. 실크·합지 견적 같이 받아 비교", cost: 0, p: M },
        { name: "입주청소", spec: "도배 완료 후 진행. 욕실 2 + 발코니 2", cost: 0, p: M }
      ]
    },
    {
      t: "13. 커튼",
      n: "사생활 문제로 거실·안방은 첫날부터 필수. 창 실측 후 견적",
      items: [
        { name: "거실 암막 커튼", spec: "", cost: 0, p: M },
        { name: "거실 커튼봉 · 레일", spec: "", cost: 0, p: M },
        { name: "안방 암막 커튼", spec: "", cost: 0, p: M },
        { name: "안방 커튼봉", spec: "", cost: 0, p: M },
        { name: "작은방 A 커튼 + 봉", spec: "", cost: 0, p: R },
        { name: "작은방 B 커튼 + 봉", spec: "", cost: 0, p: R },
        { name: "주방 커튼 · 블라인드", spec: "", cost: 0, p: R }
      ]
    },
    {
      t: "14. 욕실 소모품",
      n: "욕실 2개분. 거울·수건장은 붙박이로 있어 수납 용품 불필요",
      items: [
        { name: "목욕 수건 ×8", spec: "", cost: 0, p: M },
        { name: "발매트 ×2", spec: "", cost: 0, p: M },
        { name: "칫솔걸이 ×2", spec: "", cost: 0, p: M },
        { name: "비누받침 · 디스펜서 ×2", spec: "", cost: 0, p: M },
        { name: "변기솔 ×2", spec: "", cost: 0, p: M },
        { name: "욕실 슬리퍼 ×2", spec: "", cost: 0, p: M },
        { name: "욕실 휴지통 ×2", spec: "", cost: 0, p: M }
      ]
    },
    {
      t: "15. 세탁 · 청소",
      n: "",
      items: [
        { name: "빨래건조대", spec: "건조기 없으므로 필수", cost: 0, p: M },
        { name: "빨래바구니", spec: "", cost: 0, p: M },
        { name: "세탁세제 · 섬유유연제", spec: "", cost: 0, p: M },
        { name: "청소용품 (밀대 · 걸레)", spec: "", cost: 0, p: M }
      ]
    },
    {
      t: "16. 쓰레기 · 분리수거",
      n: "음식물은 음식물처리기로 처리 → 음식물 쓰레기통 불필요",
      items: [
        { name: "주방 일반 쓰레기통", spec: "", cost: 0, p: M },
        { name: "분리수거함 3칸", spec: "", cost: 0, p: M },
        { name: "종량제 봉투", spec: "강서구 규격", cost: 0, p: M }
      ]
    },
    {
      t: "17. 현관 · 공구",
      n: "팬트리 있어 현관 수납 부담 적음",
      items: [
        { name: "세탁기 배수호스", spec: "", cost: 0, p: M },
        { name: "멀티탭", spec: "", cost: 0, p: M },
        { name: "전동드라이버", spec: "가구 조립용", cost: 0, p: M },
        { name: "공구세트 (드라이버 · 펜치 · 줄자)", spec: "", cost: 0, p: M },
        { name: "현관매트", spec: "", cost: 0, p: O },
        { name: "우산꽂이", spec: "", cost: 0, p: O }
      ]
    }
  ];


  const SYNC_URL = "https://jsonblob.com/api/jsonBlob/019fe994-2363-7875-86e3-c59fa27b47b4";
  const POLL_MIN = 15000, POLL_MAX = 90000;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const listEl   = document.getElementById("list");
  const doneEl   = document.getElementById("done");
  const totalEl  = document.getElementById("total");
  const fillEl   = document.getElementById("fill");
  const syncEl   = document.getElementById("sync");

  let remoteState = {};
  let bought = new Set();
  let rows = [];            // 화면에 표시할 항목 [{key,name,p}]
  let lastSeen = -1, pollMs = POLL_MIN, pollTimer = null, pushTimer = null;
  let suppress = false, pendingPush = false;

  const me = (() => {
    let v = null;
    try { v = localStorage.getItem("who"); } catch (e) {}
    if (!v) { v = "기기" + Math.floor(Math.random()*900+100); try { localStorage.setItem("who", v); } catch (e) {} }
    return v;
  })();

  function setSync(t, c) { syncEl.textContent = t; syncEl.className = "sync " + (c || ""); }

  /* 구매물품 페이지에서 고른 항목만 추려낸다 */
  function buildRows(state) {
    const picked  = new Set(state.checked || []);
    const edits   = state.edits || {};
    const removed = new Set(state.removed || []);
    const custom  = Array.isArray(state.custom) ? state.custom : [];
    const out = [];

    SECTIONS.forEach(sec => {
      sec.items.forEach(base => {
        if (removed.has(base.name)) return;
        if (!picked.has(base.name)) return;
        if (base.m) return;                       // 실측 항목은 구매 대상이 아님
        const ov = edits[base.name] || {};
        out.push({ key: base.name, name: ov.name != null ? ov.name : base.name, p: ov.p != null ? ov.p : base.p });
      });
    });

    custom.forEach(c => {
      if (!picked.has("c:" + c.id)) return;
      out.push({ key: "c:" + c.id, name: c.name, p: c.p });
    });

    return out;
  }

  function render() {
    if (!rows.length) {
      listEl.innerHTML = '<div class="group"><p class="empty">아직 고른 항목이 없습니다.<br>금액 페이지에서 살 물건을 체크하면 여기에 나타납니다.</p></div>';
      doneEl.textContent = "0"; totalEl.textContent = "/ 0"; fillEl.style.width = "0%";
      return;
    }

    listEl.innerHTML = `
      <div class="group">
        ${rows.map(r => `
          <label class="item${bought.has(r.key) ? " done" : ""}">
            <input type="checkbox" data-key="${esc(r.key)}"${bought.has(r.key) ? " checked" : ""}>
            <span class="nm">${esc(r.name)}</span>
          </label>`).join("")}
      </div>`;

    const total = rows.length;
    const d = rows.filter(r => bought.has(r.key)).length;
    doneEl.textContent = d;
    totalEl.textContent = "/ " + total;
    fillEl.style.width = (total ? Math.round(d / total * 100) : 0) + "%";
  }

  document.addEventListener("change", e => {
    if (!e.target.matches('.item input[type="checkbox"]')) return;
    const k = e.target.dataset.key;
    if (e.target.checked) bought.add(k); else bought.delete(k);
    render();
    push();
  });

  document.getElementById("toggle").addEventListener("click", function () {
    document.body.classList.toggle("hidedone");
    this.textContent = document.body.classList.contains("hidedone") ? "완료 보이기" : "완료 숨기기";
  });

  function schedulePoll() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => { document.hidden ? schedulePoll() : pull(false); }, pollMs);
  }

  async function pull(initial) {
    try {
      const r = await fetch(SYNC_URL, { cache: "no-store" });
      if (r.status === 429) {
        pollMs = Math.min(pollMs * 2, POLL_MAX);
        setSync("동기화 지연 중", "busy");
        schedulePoll(); return;
      }
      if (!r.ok) throw new Error(r.status);
      pollMs = POLL_MIN;

      const s = await r.json();
      remoteState = s;
      const t = Number(s.updatedAt) || 0;

      if (initial || t > lastSeen) {
        lastSeen = t;
        bought = new Set(Array.isArray(s.bought) ? s.bought : []);
        rows = buildRows(s);
        render();
        setSync(initial ? "연결됨" : (s.by === me ? "동기화됨" : "상대방이 변경함"), "ok");
      } else {
        setSync("연결됨", "ok");
      }
      if (pendingPush) { pendingPush = false; push(); }
    } catch (e) {
      setSync("오프라인", "");
    }
    schedulePoll();
  }

  function push() {
    if (suppress) return;
    setSync("저장 중…", "busy");
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => send(0), 600);
  }

  async function send(attempt) {
    const now = Date.now();
    try {
      const r = await fetch(SYNC_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({}, remoteState, {
          bought: Array.from(bought), updatedAt: now, by: me
        }))
      });
      if (r.status === 429) {
        if (attempt < 4) {
          const w = Math.min(4000 * Math.pow(2, attempt), 60000);
          setSync("저장 대기 (" + Math.round(w/1000) + "초)", "busy");
          setTimeout(() => send(attempt + 1), w);
        } else { pendingPush = true; setSync("저장 지연 — 재시도 예약", "busy"); }
        return;
      }
      if (!r.ok) throw new Error(r.status);
      lastSeen = now;
      setSync("저장됨", "ok");
    } catch (e) {
      pendingPush = true;
      setSync("저장 실패 — 재시도 예약", "");
    }
  }

  /* 스크립트가 죽으면 빈 화면 대신 원인을 보여준다 */
  window.addEventListener("error", e => {
    listEl.innerHTML = '<div class="group"><p class="empty">화면을 그리지 못했습니다.<br>' +
      esc(String(e.message || e.error || "알 수 없는 오류")) + '</p></div>';
    setSync("오류", "");
  });

  if (typeof SECTIONS === "undefined" || !Array.isArray(SECTIONS) || !SECTIONS.length) {
    throw new Error("항목 데이터를 불러오지 못했습니다 (SECTIONS 없음)");
  }

  render();
  pull(true);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { pollMs = POLL_MIN; clearTimeout(pollTimer); pull(false); }
  });
</script>
