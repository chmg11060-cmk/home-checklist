<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>구매 체크리스트</title>
<style>
  :root {
    --ground: #F5F7F4;
    --surface: #FFFFFF;
    --surface-2: #ECF0EA;
    --line: #DCE2D9;
    --line-soft: #E8EDE5;
    --ink: #161C19;
    --ink-2: #48534D;
    --ink-3: #7B867E;
    --accent: #1F5F52;
    --accent-ink: #16443A;
    --accent-soft: #DBEBE4;
    --warn: #8A5A11;
    --shadow: 0 1px 2px rgba(22,28,25,.05), 0 8px 24px -16px rgba(22,28,25,.28);
    --font-sans: 'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,
                 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    --font-mono: ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#111614; --surface:#191F1C; --surface-2:#212824; --line:#2C3531; --line-soft:#232B27;
      --ink:#E8EDE8; --ink-2:#A5B0AA; --ink-3:#75817A;
      --accent:#6FC3AC; --accent-ink:#9BD9C7; --accent-soft:#1C382F; --warn:#D6A251;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    }
  }

  :root[data-theme="dark"] {
    --ground:#111614; --surface:#191F1C; --surface-2:#212824; --line:#2C3531; --line-soft:#232B27;
    --ink:#E8EDE8; --ink-2:#A5B0AA; --ink-3:#75817A;
    --accent:#6FC3AC; --accent-ink:#9BD9C7; --accent-soft:#1C382F; --warn:#D6A251;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    padding: 0 16px 80px;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  .wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header { padding-top: 36px; display: flex; flex-direction: column; gap: 8px; }

  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; }

  .sub { color: var(--ink-3); font-size: 14px; margin: 0; }

  /* 진행 바 */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  }

  .prog { display: flex; align-items: baseline; gap: 7px; margin-right: auto; }
  .prog .n { font-family: var(--font-mono); font-size: 24px; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .prog .d { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .track { flex: 1 1 100%; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }

  .sync { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .sync::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--ink-3); margin-right:5px; vertical-align:1px; }
  .sync.ok { color: var(--accent); } .sync.ok::before { background: var(--accent); }
  .sync.busy { color: var(--warn); } .sync.busy::before { background: var(--warn); }
  .sync.warn { color: var(--warn); font-weight: 600; } .sync.warn::before { background: var(--warn); }

  .savebtn { font-weight: 700; padding: 6px 16px; }
  .savebtn:disabled { opacity: .45; cursor: default; }
  .savebtn.dirty { background: var(--accent); color: var(--surface); border-color: var(--accent); }

  a.back {
    font-family: var(--font-sans); font-size: 13px; text-decoration: none;
    color: var(--ink-2); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; white-space: nowrap;
  }
  a.back:hover { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

  .tog {
    font-family: var(--font-sans); font-size: 13px; cursor: pointer;
    color: var(--ink-2); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; white-space: nowrap;
  }
  .tog:hover { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

  /* 목록 */
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  .ghead {
    padding: 13px 16px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; gap: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  }

  .ghead .cnt { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }

  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    border-top: 1px solid var(--line-soft);
    cursor: pointer;
  }

  .group .item:first-of-type { border-top: 0; }
  .item:hover { background: var(--surface-2); }

  .item input {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; flex: none; margin: 0;
    border: 1.5px solid var(--ink-3); border-radius: 6px;
    background: var(--surface); cursor: pointer; position: relative;
  }

  .item input:checked { background: var(--accent); border-color: var(--accent); }

  .item input:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px;
    width: 4px; height: 10px;
    border: solid var(--surface); border-width: 0 2px 2px 0;
    transform: rotate(43deg);
  }

  .item input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .nm { font-size: 15.5px; font-weight: 500; letter-spacing: -.01em; }
  .item input:checked ~ .nm { color: var(--ink-3); text-decoration: line-through; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-3); font-size: 14.5px; line-height: 1.7; }

  body.hidedone .item.done { display: none; }

  /* 모바일: 아래로 스크롤하면 상단 바를 접어 화면을 넓게 쓴다. 위로 올리면 다시 펼쳐짐 */
  @media (max-width: 620px) {
    .sync { white-space: normal; line-height: 1.3; flex: 1 1 40%; min-width: 0; }   /* 문구가 길어도 가로 스크롤 없이 줄바꿈 */
    .bar { transition: padding .18s ease, gap .18s ease; }
    body.barmini .bar { padding: 7px 14px; gap: 6px 12px; }
    body.barmini .bar .tog:not(.savebtn),   /* 접혀도 저장 버튼은 남긴다 */
    body.barmini .bar a.back { display: none; }
    body.barmini .savebtn { padding: 4px 12px; font-size: 12px; }
    body.barmini .prog .n { font-size: 18px; }
    body.barmini .prog .d { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>구매 체크리스트</h1>
    <p class="sub">구매물품 페이지에서 고른 항목만 표시. 사면 체크.</p>
  </header>

  <div class="bar">
    <div class="prog">
      <span class="n" id="done">0</span>
      <span class="d" id="total">/ 0</span>
    </div>
    <span class="sync" id="sync">불러오는 중…</span>
    <button class="tog savebtn" type="button" id="savebtn" disabled>저장</button>
    <button class="tog" type="button" id="reloadbtn" title="서버에 저장된 최신 내용을 다시 불러옴">↻</button>
    <button class="tog" type="button" id="toggle">완료 숨기기</button>
    <a class="back" href="plan.html">조감도</a>
    <a class="back" href="index.html">← 금액 페이지</a>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div id="list"></div>

</div>

        { name: "도배 (전체)", spec: "확정 항목. 잔금 직후 최우선. 실크·합지 견적 같이 받아 비교", cost: 0, p: M },
        { name: "입주청소", spec: "도배 완료 후 진행. 욕실 2 + 발코니 2", cost: 0, p: M }

    },
    {

      items: [
        { name: "거실 암막 커튼", spec: "", cost: 0, p: M },
        { name: "거실 커튼봉 · 레일", spec: "", cost: 0, p: M },
        { name: "안방 암막 커튼", spec: "", cost: 0, p: M },
        { name: "안방 커튼봉", spec: "", cost: 0, p: M },
        { name: "작은방 A 커튼 + 봉", spec: "", cost: 0, p: R },

      ]
    },
    {
      t: "14. 욕실 소모품",
      n: "욕실 2개분. 거울·수건장은 붙박이로 있어 수납 용품 불필요",
      items: [
        { name: "목욕 수건 ×8", spec: "", cost: 0, p: M },
        { name: "발매트 ×2", spec: "", cost: 0, p: M },
        { name: "칫솔걸이 ×2", spec: "", cost: 0, p: M },
        { name: "비누받침 · 디스펜서 ×2", spec: "", cost: 0, p: M },
        { name: "변기솔 ×2", spec: "", cost: 0, p: M },
        { name: "욕실 슬리퍼 ×2", spec: "", cost: 0, p: M },
        { name: "욕실 휴지통 ×2", spec: "", cost: 0, p: M }
      ]
    },
    {
      t: "15. 세탁 · 청소",
      n: "",
      items: [
        { name: "빨래건조대", spec: "건조기 없으므로 필수", cost: 0, p: M },
        { name: "빨래바구니", spec: "", cost: 0, p: M },
        { name: "세탁세제 · 섬유유연제", spec: "", cost: 0, p: M },
        { name: "청소용품 (밀대 · 걸레)", spec: "", cost: 0, p: M }
      ]
    },
    {
      t: "16. 쓰레기 · 분리수거",
      n: "음식물은 음식물처리기로 처리 → 음식물 쓰레기통 불필요",
      items: [
        { name: "주방 일반 쓰레기통", spec: "", cost: 0, p: M },
        { name: "분리수거함 3칸", spec: "", cost: 0, p: M },
        { name: "종량제 봉투", spec: "강서구 규격", cost: 0, p: M }
      ]
    },
    {
      t: "17. 현관 · 공구",
      n: "팬트리 있어 현관 수납 부담 적음",
      items: [
        { name: "세탁기 배수호스", spec: "", cost: 0, p: M },
        { name: "멀티탭", spec: "", cost: 0, p: M },
        { name: "전동드라이버", spec: "가구 조립용", cost: 0, p: M },
        { name: "공구세트 (드라이버 · 펜치 · 줄자)", spec: "", cost: 0, p: M },
        { name: "현관매트", spec: "", cost: 0, p: O },
        { name: "우산꽂이", spec: "", cost: 0, p: O }
      ]
    }
  ];


  /* ---------- GitHub 저장 (수동 저장) ----------
     jsonblob 저장소가 두 번(2026-08-11, 09-14) 통째로 사라져 GitHub 저장소의 state.json 으로 옮김.
     자동 동기화 없음 — [저장] 버튼을 눌러야 서버(GitHub)에 기록된다.
     쓰기에는 GitHub 토큰이 필요하며 기기별로 한 번 입력해 localStorage 에 보관한다 (페이지 소스에는 없음). */
  const GH_OWNER = "chmg11060-cmk", GH_REPO = "home-checklist", GH_PATH = "state.json", GH_BRANCH = "main";
  const GH_API = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_PATH;
  const TOKEN_KEY = "hc_gh_token";
  const LOCAL_KEY = "hc_backup_v1";   // 서버를 못 읽을 때 보여줄 기기 안 사본

  function saveLocal(state) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return (s && typeof s === "object") ? s : null;
    } catch (e) { return null; }
  }
  function getToken() { try { return (localStorage.getItem(TOKEN_KEY) || "").trim(); } catch (e) { return ""; } }
  function askToken(msg) {
    const v = prompt((msg ? msg + "\n\n" : "") +
      "GitHub 토큰을 입력하세요 (이 기기에만 저장됨).\n" +
      "github.com → Settings → Developer settings → Personal access tokens\n" +
      "저장소 home-checklist 의 Contents: Read and write 권한", "");
    if (v == null) return "";
    const t = v.trim();
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    return t;
  }

  /* UTF-8 ↔ base64 (GitHub Contents API 는 base64 본문을 주고받는다) */
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));

  function ghHeaders() {
    const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    const t = getToken();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }

  /* 서버의 state.json 을 읽는다. 없으면(404) 빈 상태 */
  async function ghRead() {
    const r = await fetch(GH_API + "?ref=" + GH_BRANCH + "&t=" + Date.now(), { headers: ghHeaders(), cache: "no-store" });
    if (r.status === 404) return { sha: null, state: {} };
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const s = JSON.parse(b64dec(j.content || "") || "{}");
    return { sha: j.sha, state: (s && typeof s === "object") ? s : {} };
  }

  /* state.json 을 덮어쓴다. sha 가 어긋나면(상대가 그사이 저장) 409/422 */
  async function ghWrite(state, sha, msg) {
    const body = { message: msg, content: b64enc(JSON.stringify(state, null, 2)), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const r = await fetch(GH_API, { method: "PUT", headers: Object.assign(ghHeaders(), { "Content-Type": "application/json" }), body: JSON.stringify(body) });
    if (r.ok) return (await r.json()).content.sha;
    const err = new Error("HTTP " + r.status);
    err.status = r.status;
    throw err;
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const listEl   = document.getElementById("list");
  const doneEl   = document.getElementById("done");
  const totalEl  = document.getElementById("total");
  const fillEl   = document.getElementById("fill");
  const syncEl   = document.getElementById("sync");
  const saveBtn  = document.getElementById("savebtn");

  let remoteState = {};
  let bought = new Set();
  let rows = [];            // 화면에 표시할 항목 [{key,name,p}]
  let sha = null, dirty = false, saving = false;

  const me = (() => {
    let v = null;
    try { v = localStorage.getItem("who"); } catch (e) {}
    if (!v) { v = "기기" + Math.floor(Math.random()*900+100); try { localStorage.setItem("who", v); } catch (e) {} }
    return v;
  })();

  function setSync(t, c) { syncEl.textContent = t; syncEl.className = "sync " + (c || ""); }

  /* 구매물품 페이지에서 고른 항목만 추려낸다 */
  function buildRows(state) {
    const picked  = new Set(state.checked || []);
    const edits   = state.edits || {};
    const removed = new Set(state.removed || []);
    const custom  = Array.isArray(state.custom) ? state.custom : [];
    const out = [];

    // 금액 페이지와 같은 순서: 섹션 순서대로, 각 섹션의 기본 항목 뒤에 그 섹션에서 추가한 항목
    const pushCustom = c => {
      if (!picked.has("c:" + c.id)) return;
      out.push({ key: "c:" + c.id, name: c.name, p: c.p });
    };

    SECTIONS.forEach((sec, si) => {
      sec.items.forEach(base => {
        if (removed.has(base.name)) return;
        if (!picked.has(base.name)) return;
        if (base.m) return;                       // 실측 항목은 구매 대상이 아님
        const ov = edits[base.name] || {};
        out.push({ key: base.name, name: ov.name != null ? ov.name : base.name, p: ov.p != null ? ov.p : base.p });
      });
      custom.filter(c => Number(c.sec) === si).forEach(pushCustom);
    });

    // 섹션 정보가 없는 추가 항목은 맨 뒤
    custom.filter(c => !(Number(c.sec) >= 0 && Number(c.sec) < SECTIONS.length)).forEach(pushCustom);

    return out;
  }

  function render() {
    if (!rows.length) {
      listEl.innerHTML = '<div class="group"><p class="empty">아직 고른 항목이 없습니다.<br>금액 페이지에서 살 물건을 체크하면 여기에 나타납니다.</p></div>';
      doneEl.textContent = "0"; totalEl.textContent = "/ 0"; fillEl.style.width = "0%";
      return;
    }

    listEl.innerHTML = `
      <div class="group">
        ${rows.map(r => `
          <label class="item${bought.has(r.key) ? " done" : ""}">
            <input type="checkbox" data-key="${esc(r.key)}"${bought.has(r.key) ? " checked" : ""}>
            <span class="nm">${esc(r.name)}</span>
          </label>`).join("")}
      </div>`;

    const total = rows.length;
    const d = rows.filter(r => bought.has(r.key)).length;
    doneEl.textContent = d;
    totalEl.textContent = "/ " + total;
    fillEl.style.width = (total ? Math.round(d / total * 100) : 0) + "%";
  }

  document.addEventListener("change", e => {
    if (!e.target.matches('.item input[type="checkbox"]')) return;
    const k = e.target.dataset.key;
    if (e.target.checked) bought.add(k); else bought.delete(k);
    render();
    push();
  });

  document.getElementById("toggle").addEventListener("click", function () {
    document.body.classList.toggle("hidedone");
    this.textContent = document.body.classList.contains("hidedone") ? "완료 보이기" : "완료 숨기기";
  });

  function showState(s) {
    bought = new Set(Array.isArray(s.bought) ? s.bought : []);
    rows = buildRows(s);
    render();
  }

  function setDirty(on) {
    dirty = on;
    saveBtn.disabled = !on || saving;
    saveBtn.classList.toggle("dirty", on);
    if (on) setSync("저장 안 됨", "warn");
  }

  /* 체크를 바꾸면 곧바로 서버에 보내지 않고 "저장 안 됨" 표시만 한다 */
  function push() { setDirty(true); }

  function fmtTime(t) {
    t = Number(t) || 0;
    if (!t) return "";
    const d = new Date(t), p = n => String(n).padStart(2, "0");
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  async function load(initial) {
    setSync("불러오는 중…", "busy");
    try {
      const r = await ghRead();
      sha = r.sha;
      remoteState = r.state;
      // 기기 사본이 서버보다 최신(서버가 비었거나 되돌아간 경우) → 사본을 보여주고 저장을 권한다
      const bak = initial ? loadLocal() : null;
      if (bak && (Number(bak.updatedAt) || 0) > (Number(remoteState.updatedAt) || 0)) {
        remoteState = Object.assign({}, remoteState, bak);
        showState(remoteState);
        setDirty(true);
        setSync("기기 사본 — 저장 필요", "warn");
        return;
      }
      showState(remoteState);
      saveLocal(remoteState);
      setDirty(false);
      setSync(sha ? "불러옴 " + fmtTime(remoteState.updatedAt) : "저장된 내용 없음", "ok");
    } catch (e) {
      const bak = initial ? loadLocal() : null;
      if (bak) { remoteState = bak; showState(bak); setDirty(false); }
      setSync("서버를 못 읽음" + (bak ? " — 기기 사본" : ""), "");
    }
  }

  async function save() {
    if (saving) return;
    let token = getToken();
    if (!token) { token = askToken(); if (!token) { setSync("토큰 없음", ""); return; } }

    saving = true;
    saveBtn.disabled = true;
    setSync("저장 중…", "busy");

    const now = Date.now();
    const mine = { bought: Array.from(bought), updatedAt: now, by: me };
    let state = Object.assign({}, remoteState, mine);
    saveLocal(state);

    try {
      try {
        sha = await ghWrite(state, sha, "구매 체크 저장 (" + me + ")");
      } catch (e) {
        if (e.status === 409 || e.status === 422) {          // 그사이 상대가 저장함 → 최신 위에 bought 만 얹어 재시도
          const r = await ghRead();
          state = Object.assign({}, r.state, mine);
          sha = await ghWrite(state, r.sha, "구매 체크 저장 (" + me + ")");
          rows = buildRows(state);                            // 상대가 고른 항목 변화도 반영
        } else throw e;
      }
      remoteState = state;
      render();
      setDirty(false);
      setSync("저장됨 " + fmtTime(now), "ok");
    } catch (e) {
      if (e.status === 401 || e.status === 403) {
        setSync("토큰 오류", "");
        if (askToken("저장 실패 (" + e.message + "). 토큰을 다시 입력하세요.")) { saving = false; setDirty(true); return save(); }
      } else {
        setSync("저장 실패 " + e.message, "");
      }
      setDirty(true);
    } finally {
      saving = false;
      saveBtn.disabled = !dirty;
    }
  }

  saveBtn.addEventListener("click", save);
  document.getElementById("reloadbtn").addEventListener("click", () => {
    if (dirty && !confirm("저장하지 않은 변경이 있습니다. 버리고 서버 내용을 다시 불러올까요?")) return;
    load(false);
  });
  window.addEventListener("beforeunload", e => {
    if (!dirty) return;
    e.preventDefault(); e.returnValue = "";
  });

  /* 스크립트가 죽으면 빈 화면 대신 원인을 보여준다 */
  window.addEventListener("error", e => {
    listEl.innerHTML = '<div class="group"><p class="empty">화면을 그리지 못했습니다.<br>' +
      esc(String(e.message || e.error || "알 수 없는 오류")) + '</p></div>';
    setSync("오류", "");
  });

  if (typeof SECTIONS === "undefined" || !Array.isArray(SECTIONS) || !SECTIONS.length) {
    throw new Error("항목 데이터를 불러오지 못했습니다 (SECTIONS 없음)");
  }

  render();
  load(true);
  document.addEventListener("visibilitychange", () => {      // 탭으로 돌아오면 상대가 저장한 내용을 받아온다
    if (!document.hidden && !dirty && !saving) load(false);
  });

  /* 모바일에서 스크롤을 내리면 상단 바를 접는다 (맨 위 근처로 돌아오면 다시 펼침) */
  (function () {
    /* 방향 기준 토글 금지 — 주소창 여닫힘·문서 높이 변화가 되먹임을 만들어
       접힘/펼침이 무한 반복된다(2026-08-18 실제 버그). 절대 위치 + 넓은 히스테리시스로만 판단. */
    const FOLD = 280, UNFOLD = 100;
    let ticking = false;

    function update() {
      const y = window.scrollY || 0;
      const mini = document.body.classList.contains("barmini");
      if (!mini && y > FOLD) document.body.classList.add("barmini");
      else if (mini && y < UNFOLD) document.body.classList.remove("barmini");
      ticking = false;
    }

    window.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }, { passive: true });

    update();
  })();
</script>
